<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Citas Médicas | MediCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="header">
  <div class="container header-top">
    <!-- LOGO -->
    <a href="index.html" class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00E5D9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        <path d="M12 7v6"/>
        <path d="M9 10h6"/>
      </svg>
      <span>MediCare</span>
    </a>

    <!-- BOTÓN DE MENÚ HAMBURGUESA PARA MÓVILES -->
    <button class="mobile-menu-toggle" id="btn-toggle-menu" aria-label="Abrir Menú">
      <i data-lucide="menu"></i>
    </button>
    
    <!-- MENÚ DE NAVEGACIÓN -->
    <nav id="main-nav">
      <ul class="nav-links">
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="especialidades.html">Especialidades</a></li>
        <li><a href="doctores.html">¿Eres Médico?</a></li>
        <li><a href="citas.html" style="color: var(--color-primary-hover); font-weight: 700;">Mis Citas</a></li>
      </ul>
    </nav>

    <!-- FORMULARIO DE BÚSQUEDA COMPACTO -->
    <form class="header-search-form" id="header-search-form">
      <input type="text" id="header-search-input" placeholder="Busca por médico o especialidad...">
      <button type="submit" aria-label="Buscar"><i data-lucide="search"></i></button>
    </form>

    <!-- ACCIONES / BOTONES LADO A LADO EN MÓVIL -->
    <div class="header-actions">
      <button class="btn btn-primary btn-header" id="btn-open-booking">
        <i data-lucide="calendar"></i>
        <span>Reserva Cita</span>
      </button>
      <a href="login.html" class="btn btn-secondary btn-header">
        <i data-lucide="user"></i>
        <span>Mi Cuenta</span>
      </a>
    </div>
  </div>
</header>

  <!-- BREADCRUMBS -->
  <div style="background-color: var(--color-bg-alt); padding: 15px 0;">
    <div class="container">
      <small style="color: var(--color-text-muted);"><a href="index.html">Inicio</a> &gt; Mis Citas</small>
      <h1 style="font-size: 2rem; margin-top: 5px;">Panel de Historial de Citas</h1>
    </div>
  </div>

  <!-- CONTENEDOR DINÁMICO DE CITAS -->
  <section class="section-padding">
    <div class="container" id="appointments-container">
      <!-- Se llena dinámicamente mediante JavaScript -->
    </div>
  </section>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 WebApp de Salud. Todos los derechos reservados.</p></div>
  </footer>

  <script src="js/doctors.js"></script>
  <script src="js/app.js"></script>

</html>

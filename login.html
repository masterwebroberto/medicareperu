<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso / Registro | MediCare</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="background-color: var(--color-bg-alt); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <!-- HEADER NAVEGACIÓN -->
  <header class="header">
    <div class="container header-top">
      <a href="index.html" class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00E5D9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          <path d="M12 7v6"/>
          <path d="M9 10h6"/>
        </svg>
        <span>MediCare</span>
      </a>
      
      <nav>
        <ul class="nav-links">
          <li><a href="servicios.html">Servicios</a></li>
          <li><a href="especialidades.html">Especialidades</a></li>
          <li><a href="doctores.html">¿Eres Médico?</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary">
          <i data-lucide="arrow-left"></i> Volver al Inicio
        </a>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE LOGIN Y REGISTRO -->
  <main style="padding: 40px 15px; display: flex; justify-content: center; align-items: center; flex: 1;">
    <div class="auth-card">
      
      <!-- PESTAÑAS (TABS) -->
      <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tab-login">Ingresar</button>
        <button type="button" class="tab-btn" id="tab-register">Registrarme</button>
      </div>

      <!-- FORMULARIO 1: INICIAR SESIÓN -->
      <form id="form-auth" class="auth-form active">
        <div class="form-group">
          <label>Tipo de Documento</label>
          <select required>
            <option value="dni">DNI</option>
            <option value="ce">Carnet de Extranjería</option>
            <option value="pasaporte">Pasaporte</option>
          </select>
        </div>

        <div class="form-group">
          <label>Número de Documento</label>
          <input type="text" placeholder="Ingresa tu número de documento" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Recordar número de documento</label>
          <a href="#" style="color: var(--color-primary); font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Iniciar Sesión</button>
      </form>

      <!-- FORMULARIO 2: REGISTRO DE NUEVO PACIENTE -->
      <form id="form-register" class="auth-form">
        <div class="form-group">
          <label>Nombres Completos</label>
          <input type="text" placeholder="Ej. Ana Maria" required>
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" placeholder="Ej. Torres Pérez" required>
        </div>

        <div class="form-group">
          <label>Tipo de Documento</label>
          <select required>
            <option value="dni">DNI</option>
            <option value="ce">Carnet de Extranjería</option>
            <option value="pasaporte">Pasaporte</option>
          </select>
        </div>

        <div class="form-group">
          <label>Número de Documento</label>
          <input type="text" placeholder="Ingresa tu documento" required>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label>Teléfono / Celular</label>
          <input type="tel" placeholder="987 654 321" required>
        </div>

        <div class="form-group">
          <label>Crear Contraseña</label>
          <input type="password" placeholder="Mínimo 8 caracteres" required>
        </div>

        <div class="form-options">
          <label><input type="checkbox" required> Acepto los Términos y Condiciones y Políticas de Privacidad</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Crear Cuenta de Paciente</button>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 WebApp de Salud. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
